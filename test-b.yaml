AWSTemplateFormatVersion: "2010-09-09"
Description: Bisect test B - adds GlueExecutionRole + Database + Crawler on top of test A

Parameters:
  InputBucketName:
    Type: String
    Default: upload-csv-cf-bisect-b
  OutputBucketName:
    Type: String
    Default: dest-csv-cf-bisect-b
  ArtifactsBucketName:
    Type: String
    Default: csv-pipeline-cf-artifacts
  LambdaCodeS3Key:
    Type: String
    Default: lambda-cf/lambda_function.zip
  GlueDatabaseName:
    Type: String
    Default: pipeline_db_cf_bisect_b
  WorkflowName:
    Type: String
    Default: csv-pipeline-workflow-cf
  CrawlerName:
    Type: String
    Default: csv-pipeline-crawler-cf-bisect-b
  StartTriggerName:
    Type: String
    Default: csv-pipeline-start-trigger-cf
  LambdaFunctionName:
    Type: String
    Default: csv-pipeline-trigger-lambda-cf-bisect-b

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csv-pipeline-lambda-role-cf-bisect-b
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: csv-pipeline-lambda-role-cf-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:StartTrigger
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${WorkflowName}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/${StartTriggerName}"

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csv-pipeline-glue-role-cf-bisect-b
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: csv-pipeline-glue-role-cf-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}"
                  - !Sub "arn:aws:s3:::${InputBucketName}/*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*"

  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          WORKFLOW_NAME: !Ref WorkflowName
          START_TRIGGER_NAME: !Ref StartTriggerName

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TriggerLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"

  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TriggerLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .csv

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: GlueDatabase
    Properties:
      Name: !Ref CrawlerName
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/"
