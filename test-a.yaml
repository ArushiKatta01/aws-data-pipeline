AWSTemplateFormatVersion: "2010-09-09"
Description: Bisect test A - IAM + Lambda + S3 only

Parameters:
  InputBucketName:
    Type: String
    Default: upload-csv-cf-bisect-a
  OutputBucketName:
    Type: String
    Default: dest-csv-cf-bisect-a
  ArtifactsBucketName:
    Type: String
    Default: csv-pipeline-cf-artifacts
  LambdaCodeS3Key:
    Type: String
    Default: lambda-cf/lambda_function.zip
  WorkflowName:
    Type: String
    Default: csv-pipeline-workflow-cf
  StartTriggerName:
    Type: String
    Default: csv-pipeline-start-trigger-cf
  LambdaFunctionName:
    Type: String
    Default: csv-pipeline-trigger-lambda-cf-bisect-a

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csv-pipeline-lambda-role-cf-bisect-a
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: csv-pipeline-lambda-role-cf-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:StartTrigger
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${WorkflowName}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/${StartTriggerName}"

  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          WORKFLOW_NAME: !Ref WorkflowName
          START_TRIGGER_NAME: !Ref StartTriggerName

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TriggerLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"

  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TriggerLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .csv

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
