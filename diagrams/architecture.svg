<svg viewBox="0 0 1150 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1150" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="bold" fill="#111">CSV Pipeline — S3 → Lambda → Glue Crawler → EventBridge → Lambda → Glue ETL Job → S3 + Catalog</text>

  <!-- User -->
  <circle cx="55" cy="150" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="55" y1="164" x2="55" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="38" y1="177" x2="72" y2="177" stroke="#333" stroke-width="2"/>
  <text x="10" y="215" font-size="10" fill="#333">You (upload)</text>
  <line x1="75" y1="175" x2="110" y2="175" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Input bucket -->
  <rect x="110" y="130" width="120" height="80" rx="6" fill="#3F8624"/>
  <text x="170" y="170" font-size="20" fill="#fff" text-anchor="middle">S3</text>
  <text x="170" y="225" font-size="10" text-anchor="middle" fill="#111">upload-csv-...</text>
  <text x="170" y="238" font-size="9" text-anchor="middle" fill="#666" font-style="italic">input bucket</text>

  <line x1="230" y1="170" x2="275" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <text x="232" y="160" font-size="9" fill="#555">ObjectCreated</text>

  <!-- Lambda 1 -->
  <rect x="275" y="130" width="130" height="80" rx="6" fill="#D86613"/>
  <text x="340" y="175" font-size="15" fill="#fff" text-anchor="middle">λ</text>
  <text x="340" y="225" font-size="10" text-anchor="middle" fill="#111">pipeline-trigger-</text>
  <text x="340" y="237" font-size="10" text-anchor="middle" fill="#111">lambda</text>

  <line x1="405" y1="170" x2="450" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <text x="405" y="160" font-size="9" fill="#555">start_crawler()</text>

  <!-- Crawler -->
  <rect x="450" y="130" width="140" height="80" rx="6" fill="#5A3EBB"/>
  <text x="520" y="170" font-size="12" fill="#fff" text-anchor="middle">Glue Crawler</text>
  <text x="520" y="225" font-size="10" text-anchor="middle" fill="#111">pipeline-input-</text>
  <text x="520" y="237" font-size="10" text-anchor="middle" fill="#111">crawler</text>

  <line x1="590" y1="170" x2="635" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <text x="592" y="160" font-size="9" fill="#555">registers table</text>

  <!-- Catalog -->
  <rect x="635" y="130" width="140" height="80" rx="6" fill="#3B4B9B"/>
  <text x="705" y="165" font-size="12" fill="#fff" text-anchor="middle">Glue Data</text>
  <text x="705" y="180" font-size="12" fill="#fff" text-anchor="middle">Catalog</text>
  <text x="705" y="225" font-size="10" text-anchor="middle" fill="#111">pipeline_db</text>

  <!-- crawler success arrow down to EventBridge -->
  <line x1="520" y1="210" x2="520" y2="300" stroke="#555" marker-end="url(#arrow)"/>
  <text x="528" y="260" font-size="9" fill="#555">State Change event</text>
  <text x="528" y="272" font-size="9" fill="#555">(state = Succeeded)</text>

  <!-- EventBridge -->
  <rect x="440" y="300" width="160" height="70" rx="6" fill="#E7157B"/>
  <text x="520" y="330" font-size="11" fill="#fff" text-anchor="middle">EventBridge Rule</text>
  <text x="520" y="345" font-size="9" fill="#fff" text-anchor="middle">crawler-success-</text>
  <text x="520" y="357" font-size="9" fill="#fff" text-anchor="middle">starts-job</text>

  <line x1="600" y1="335" x2="650" y2="335" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Lambda 2 -->
  <rect x="650" y="300" width="150" height="70" rx="6" fill="#D86613"/>
  <text x="725" y="330" font-size="14" fill="#fff" text-anchor="middle">λ</text>
  <text x="725" y="350" font-size="9" fill="#fff" text-anchor="middle">start-etl-job-lambda</text>

  <line x1="800" y1="335" x2="845" y2="335" stroke="#555" marker-end="url(#arrow)"/>
  <text x="802" y="325" font-size="9" fill="#555">start_job_run()</text>

  <!-- Glue Job -->
  <rect x="845" y="290" width="160" height="90" rx="6" fill="#7A3AC9"/>
  <text x="925" y="325" font-size="12" fill="#fff" text-anchor="middle">Glue ETL Job</text>
  <text x="925" y="340" font-size="10" fill="#fff" text-anchor="middle">pipeline-etl-job</text>
  <text x="925" y="355" font-size="9" fill="#fff" text-anchor="middle">Python Shell · 0.0625 DPU</text>

  <!-- job reads input -->
  <path d="M 845,320 L 845,420 L 170,420 L 170,215" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="400" y="440" font-size="9" fill="#333">reads latest CSV from input bucket (boto3 + pandas)</text>

  <!-- job writes output + updates catalog -->
  <line x1="925" y1="380" x2="925" y2="470" stroke="#333" marker-end="url(#arrow)"/>
  <text x="935" y="420" font-size="9" fill="#333">writes CSV +</text>
  <text x="935" y="432" font-size="9" fill="#333">registers table</text>
  <text x="935" y="444" font-size="9" fill="#333">(awswrangler)</text>

  <!-- Output bucket -->
  <rect x="855" y="470" width="140" height="80" rx="6" fill="#3F8624"/>
  <text x="925" y="510" font-size="18" fill="#fff" text-anchor="middle">S3</text>
  <text x="925" y="565" font-size="10" text-anchor="middle" fill="#111">dest-csv-...</text>
  <text x="925" y="578" font-size="9" text-anchor="middle" fill="#666" font-style="italic">output bucket</text>

  <path d="M 705,210 L 705,600 L 995,600 L 995,550" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="720" y="595" font-size="9" fill="#333">output_data table also created in pipeline_db</text>

  <!-- IAM roles -->
  <rect x="60" y="290" width="150" height="90" rx="6" fill="#C0392B"/>
  <text x="135" y="315" font-size="11" fill="#fff" text-anchor="middle">IAM Roles</text>
  <text x="135" y="332" font-size="9" fill="#fff" text-anchor="middle">pipeline-lambda-role</text>
  <text x="135" y="346" font-size="9" fill="#fff" text-anchor="middle">pipeline-glue-role</text>
  <text x="135" y="360" font-size="9" fill="#fff" text-anchor="middle">start-etl-job-lambda role</text>

  <!-- CloudWatch -->
  <rect x="60" y="470" width="150" height="80" rx="6" fill="#E7157B"/>
  <text x="135" y="505" font-size="11" fill="#fff" text-anchor="middle">CloudWatch Logs</text>
  <text x="135" y="522" font-size="9" fill="#fff" text-anchor="middle">every print() and error</text>
  <text x="135" y="535" font-size="9" fill="#fff" text-anchor="middle">from every step lands here</text>

  <text x="30" y="610" font-size="10" fill="#777">Solid arrows = direct call/data flow · dashed = read/write relationship, not a direct API call</text>
</svg>
