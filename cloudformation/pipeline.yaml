AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSV Data Pipeline (CloudFormation variant) - S3 -> Lambda -> Glue Workflow
  (Crawler -> Conditional Trigger -> Glue Job) -> cleaned CSV + Catalog table.
  Mirrors the console-built "csv-pipeline" project 1:1, with every resource
  suffixed "-cf" so it can run side by side with the original.

Parameters:
  InputBucketName:
    Type: String
    Default: upload-csv-cf
  OutputBucketName:
    Type: String
    Default: dest-csv-cf
  ArtifactsBucketName:
    Type: String
    Description: Existing bucket holding the zipped Lambda code and the Glue script (uploaded by the deploy workflow before this stack runs).
    Default: csv-pipeline-cf-artifacts
  LambdaCodeS3Key:
    Type: String
    Default: lambda-cf/lambda_function.zip
  GlueScriptS3Key:
    Type: String
    Default: glue-cf/csv_pipeline_etl_job_cf.py
  GlueDatabaseName:
    Type: String
    Default: pipeline_db_cf
  GlueOutputTableName:
    Type: String
    Default: csv_output_data_cf
  WorkflowName:
    Type: String
    Default: csv-pipeline-workflow-cf
  CrawlerName:
    Type: String
    Default: csv-pipeline-crawler-cf
  GlueJobName:
    Type: String
    Default: csv-pipeline-etl-job-cf
  StartTriggerName:
    Type: String
    Default: csv-pipeline-start-trigger-cf
  SuccessTriggerName:
    Type: String
    Default: csv-pipeline-success-trigger-cf
  LambdaFunctionName:
    Type: String
    Default: csv-pipeline-trigger-lambda-cf

Resources:

  # ---------- IAM ----------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csv-pipeline-lambda-role-cf
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: csv-pipeline-lambda-role-cf-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:StartTrigger
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${WorkflowName}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/${StartTriggerName}"

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csv-pipeline-glue-role-cf
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: csv-pipeline-glue-role-cf-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}"
                  - !Sub "arn:aws:s3:::${InputBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${OutputBucketName}"
                  - !Sub "arn:aws:s3:::${OutputBucketName}/*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*"

  # ---------- Lambda ----------

  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          WORKFLOW_NAME: !Ref WorkflowName
          START_TRIGGER_NAME: !Ref StartTriggerName

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TriggerLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"

  # ---------- S3 ----------

  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TriggerLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .csv

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName

  # ---------- Glue ----------

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: GlueDatabase
    Properties:
      Name: !Ref CrawlerName
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/"

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Ref GlueJobName
      Role: !GetAtt GlueExecutionRole.Arn
      GlueVersion: "3.0"
      MaxCapacity: 0.0625
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ArtifactsBucketName}/${GlueScriptS3Key}"
      DefaultArguments:
        "--INPUT_BUCKET": !Ref InputBucketName
        "--OUTPUT_BUCKET": !Ref OutputBucketName
        "--GLUE_DATABASE": !Ref GlueDatabaseName
        "--OUTPUT_TABLE": !Ref GlueOutputTableName

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Ref WorkflowName
      Description: Crawler -> conditional trigger -> ETL job (CloudFormation variant)

  StartTrigger:
    # ON_DEMAND triggers don't support StartOnCreation - they just need to
    # exist so the Lambda's glue.start_trigger() call can fire them later.
    Type: AWS::Glue::Trigger
    DependsOn: GlueCrawler
    Properties:
      Name: !Ref StartTriggerName
      Type: ON_DEMAND
      WorkflowName: !Ref WorkflowName
      Actions:
        - CrawlerName: !Ref CrawlerName

  SuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn: [GlueCrawler, GlueJob]
    Properties:
      Name: !Ref SuccessTriggerName
      Type: CONDITIONAL
      WorkflowName: !Ref WorkflowName
      StartOnCreation: true
      Predicate:
        Logical: AND
        Conditions:
          - CrawlerName: !Ref CrawlerName
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref GlueJobName

Outputs:
  InputBucket:
    Value: !Ref InputBucket
  OutputBucket:
    Value: !Ref OutputBucket
  LambdaFunction:
    Value: !Ref TriggerLambda
  WorkflowName:
    Value: !Ref WorkflowName
  GlueDatabase:
    Value: !Ref GlueDatabaseName
