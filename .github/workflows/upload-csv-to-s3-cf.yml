name: Upload CSV to S3 (CF variant)

# CF-variant of upload-csv-to-s3.yml - watches incoming-csvs-cf/ and uploads
# into the CloudFormation-managed input bucket (upload-csv-cf) instead of
# the original console-built bucket.
on:
  push:
    branches: [main]
    paths:
      - "incoming-csvs-cf/**.csv"

permissions:
  contents: read

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Find changed CSV files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'incoming-csvs-cf/*.csv')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload each changed CSV to S3
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Uploading $file"
              aws s3 cp "$file" "s3://upload-csv-cf/$(basename "$file")"
            fi
          done <<< "${{ steps.changed.outputs.files }}"
