name: Upload CSV to S3 (triggers the pipeline)

# Runs whenever a CSV is added or changed under incoming-csvs/ on main.
# Only pushes to that folder matter - unrelated commits won't fire this.
on:
  push:
    branches: [main]
    paths:
      - "incoming-csvs/**.csv"

permissions:
  contents: read   # only needs to check out the repo

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit too, to diff which files changed

      - name: Configure AWS credentials (IAM user access keys, from repo secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Find changed CSV files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'incoming-csvs/*.csv')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload each changed CSV to S3
        run: |
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Uploading $file"
              aws s3 cp "$file" "s3://upload-csv-1233219898/$(basename "$file")"
            fi
          done <<< "${{ steps.changed.outputs.files }}"