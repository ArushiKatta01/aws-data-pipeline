name: Deploy CF Stack

# Runs whenever the CloudFormation template or the CF-variant Lambda/Glue
# code changes on main. Uploads the Lambda zip + Glue script to an
# artifacts bucket, then deploys/updates the CloudFormation stack.
on:
  push:
    branches: [main]
    paths:
      - "cloudformation/**"
      - "lambda-cf/**"
      - "glue-cf/**"
      - ".github/workflows/deploy-cf-stack.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ARTIFACTS_BUCKET: csv-pipeline-cf-artifacts
  STACK_NAME: csv-pipeline-cf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure artifacts bucket exists
        run: |
          if aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" 2>/dev/null; then
            echo "Bucket $ARTIFACTS_BUCKET already exists, continuing."
          else
            echo "Bucket $ARTIFACTS_BUCKET not found, creating it."
            aws s3api create-bucket \
              --bucket "$ARTIFACTS_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

      - name: Zip Lambda code
        run: |
          cd lambda-cf
          zip lambda_function.zip lambda_function.py

      - name: Upload Lambda zip + Glue script to artifacts bucket
        # Keys are suffixed with the commit SHA so every push produces a
        # new S3 object - CloudFormation only redeploys Lambda code / picks
        # up a changed Glue script when the S3 key it points at changes.
        run: |
          LAMBDA_KEY="lambda-cf/lambda_function-${GITHUB_SHA}.zip"
          GLUE_KEY="glue-cf/csv_pipeline_etl_job_cf-${GITHUB_SHA}.py"
          aws s3 cp lambda-cf/lambda_function.zip "s3://$ARTIFACTS_BUCKET/$LAMBDA_KEY"
          aws s3 cp glue-cf/csv_pipeline_etl_job_cf.py "s3://$ARTIFACTS_BUCKET/$GLUE_KEY"
          echo "LAMBDA_KEY=$LAMBDA_KEY" >> "$GITHUB_ENV"
          echo "GLUE_KEY=$GLUE_KEY" >> "$GITHUB_ENV"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/pipeline.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ArtifactsBucketName="$ARTIFACTS_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_KEY" \
              GlueScriptS3Key="$GLUE_KEY" \
            --no-fail-on-empty-changeset
